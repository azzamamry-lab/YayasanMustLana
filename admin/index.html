<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Yayasan Mustaqbal Lana</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #14b8a6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      text-align: center;
    }
    .login-box svg { width: 56px; height: 56px; color: #0f766e; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #0f766e; }
    button {
      width: 100%;
      padding: 14px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    button:hover { background: #0d6b63; }
    .error {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .back-link {
      display: block;
      margin-top: 20px;
      color: #64748b;
      font-size: 13px;
      text-decoration: none;
    }
    .back-link:hover { color: #0f766e; }
  </style>
</head>
<body>
  <div class="login-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <circle cx="12" cy="16" r="1" fill="currentColor"/>
    </svg>
    <h1>Panel Admin</h1>
    <p>Yayasan Islam Mustaqbal Lana</p>
    <div class="error" id="error">Password salah. Coba lagi.</div>
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" placeholder="Masukkan kata sandi..." required autofocus />
      </div>
      <button type="submit">Masuk</button>
    </form>
    <a href="../" class="back-link">← Kembali ke website</a>
  </div>
  <script>
    (async () => {
      // Ambil config untuk dapat password
      let config = {};
      try {
        const res = await fetch('../config.json');
        config = await res.json();
      } catch(e) {}

      const ADMIN_PASSWORD = config.admin_password || 'mustaqbal2024';

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const pw = document.getElementById('password').value;
        if (pw === ADMIN_PASSWORD) {
          sessionStorage.setItem('yayasan_admin_auth', 'true');
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('error').style.display = 'block';
          document.getElementById('password').value = '';
        }
      });
    })();
  </script>
</body>
</html>
