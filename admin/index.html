<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Yayasan Bin Sef Al Khoiriyah</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="30" height="30">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          <circle cx="12" cy="16" r="1" fill="currentColor"/>
        </svg>
      </div>
      <h1>Panel Admin</h1>
      <p class="sub">Yayasan Islam Bin Sef Al Khoiriyah</p>
      <div class="alert" id="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="btnLogin">Masuk</button>
      </form>
      <a href="/" class="back-link">← Kembali ke website</a>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    (function () {
      // Sudah login? Langsung ke dashboard.
      fetch('/api/session')
        .then(function (r) { return r.json(); })
        .then(function (s) { if (s.authed) window.location.href = 'dashboard.html'; })
        .catch(function () {});

      var form = document.getElementById('loginForm');
      var alertBox = document.getElementById('alert');
      var btn = document.getElementById('btnLogin');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        alertBox.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Memeriksa...';

        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok && res.d.success) {
              window.location.href = 'dashboard.html';
            } else {
              alertBox.textContent = (res.d && res.d.error) || 'Login gagal. Coba lagi.';
              alertBox.classList.add('show');
              btn.disabled = false;
              btn.textContent = 'Masuk';
            }
          })
          .catch(function () {
            alertBox.textContent = 'Tidak dapat terhubung ke server. Coba lagi.';
            alertBox.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Masuk';
          });
      });
    })();
  </script>
</body>
</html>
